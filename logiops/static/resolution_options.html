<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Resolution options</title>
<style>
  :root, :root[data-theme="light"] {
    --bg: var(--color-background-primary, #FFFFFF); --card: var(--color-background-secondary, #FFFFFF);
    --text: var(--color-text-primary, #111418); --muted: var(--color-text-secondary, #454C55);
    --line: var(--color-border-primary, #C9CED5); --rule: #111418; --accent: #0B4F9C; --accent-hover: #093F7D; --accent-ink: #FFFFFF;
    --button: #FFFFFF; --button-hover: #F4F5F7; --late: #B8102A; --ok: #1D7A3C; --band-ink: #FFFFFF;
    --tag: #FFF3D1; --tag-ink: #664400; --preference: #664400; --pad: 16px;
    --inset-top: 0px; --inset-right: 0px; --inset-bottom: 0px; --inset-left: 0px;
    color-scheme: light; font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif); color: var(--text); background: var(--bg);
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #111418); --card: var(--color-background-secondary, #1A1E24);
    --text: var(--color-text-primary, #F2F4F6); --muted: var(--color-text-secondary, #B4BCC6);
    --line: var(--color-border-primary, #39404A); --rule: #F2F4F6; --accent: #8AB8F0; --accent-hover: #A9CBF5; --accent-ink: #111418;
    --button: #1A1E24; --button-hover: #262B33; --late: #FF9AA8; --ok: #7FD49A; --band-ink: #111418;
    --tag: #3D3214; --tag-ink: #FFE3A3; --preference: #FFE3A3;
    color-scheme: dark;
  }
  body { margin: 0; padding: var(--inset-top) var(--inset-right) var(--inset-bottom) var(--inset-left); background: var(--bg); font-size: 14px; line-height: 1.4; }
  h2 { margin: 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .waiting { padding: var(--pad); color: var(--muted); }
  .plan.pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: start; padding: 16px var(--pad); border-bottom: 2px solid var(--rule); background: var(--card); }
  .band { grid-column: 1 / -1; margin: -16px calc(-1 * var(--pad)) 0; padding: 7px var(--pad); color: var(--band-ink); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .band.ok { background: var(--ok); }
  .band.late { background: var(--late); }
  .pick-name { font-size: 18px; line-height: 1.3; letter-spacing: -.01em; text-wrap: balance; }
  .pick .figures { text-align: right; white-space: nowrap; }
  .cost { display: block; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .delay { display: block; margin-top: 6px; color: var(--muted); }
  .why { grid-column: 1 / -1; margin: 0; color: var(--preference); line-height: 1.5; }
  p.preference { margin: 0; padding: 12px var(--pad) 0; color: var(--preference); line-height: 1.5; }
  .outcomes { grid-column: 1 / -1; display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 15px; }
  .outcomes li { display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 12px; align-items: baseline; }
  .outcomes .verdict { color: var(--ok); font-weight: 700; font-variant-numeric: tabular-nums; }
  .outcomes .late .verdict { color: var(--late); }
  .pick-text { display: grid; gap: 6px; min-width: 0; }
  .allocation { margin: 0; color: var(--muted); }
  .pick button { grid-column: 1 / -1; justify-self: start; border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .pick button:hover { background: var(--accent-hover); }
  .others { padding: 14px var(--pad) 2px; color: var(--muted); font-size: 14px; font-weight: 600; }
  .plans { margin: 0; padding: 0; list-style: none; }
  .plans .plan { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 16px; align-items: center; padding: 10px var(--pad); }
  .plans .plan + .plan { border-top: 1px solid var(--line); }
  .plan-name { font-size: 15px; }
  .orders { display: block; margin-top: 2px; color: var(--muted); }
  .orders .late { color: var(--late); }
  .plans .figures { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plans .figures strong { display: block; font-size: 16px; }
  .plans .figures small { display: block; color: var(--muted); font-size: 14px; }
  button { min-height: 44px; padding: 6px 16px; border: 2px solid var(--rule); border-radius: 6px; background: var(--button); color: var(--text); font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
  button:hover { background: var(--button-hover); }
  button:focus-visible { outline: 3px solid var(--rule); outline-offset: 2px; }
  button.more { margin: 4px var(--pad) 0; }
  .tag { display: inline-block; margin-left: 8px; padding: 1px 7px; border: 1.5px solid transparent; border-radius: 3px; vertical-align: 2px; color: var(--tag-ink); background: var(--tag); font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .tag.pick-tag { border-color: var(--accent); color: var(--accent); background: transparent; }
  .tag.done-tag { border-color: var(--ok); color: var(--ok); background: transparent; }
  .footnote { margin: 0; padding: 12px var(--pad) 14px; color: var(--muted); font-size: 13px; }
  body.compact { --pad: 12px; }
  body.compact .plan.pick { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  body.compact .pick .figures { text-align: left; }
  body.compact .cost { display: inline; font-size: 26px; }
  body.compact .delay { display: inline; margin: 0 0 0 8px; }
  body.compact .outcomes li { grid-template-columns: 6em minmax(0, 1fr); }
  body.compact .plans .plan { grid-template-columns: minmax(0, 1fr) auto; }
  body.compact .plans .plan button { grid-column: 1 / -1; justify-self: start; }
  body.compact button { min-height: 48px; }
  body.compact .pick button { justify-self: stretch; }
</style>
</head>
<body>
<main id="root" class="waiting">Waiting for the investigation result…</main>
<script>
"use strict";
(() => {
  const PROTOCOL = "2026-01-26";
  const PAGE = 5;
  const HOST_STYLE = /^--(?:color|font|border)-[a-z0-9-]+$/;
  let nextId = 1;
  const pending = new Map();
  const send = (message) => window.parent.postMessage(message, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    send({ jsonrpc: "2.0", id, method, params });
  });
  const notify = (method, params) => send({ jsonrpc: "2.0", method, params });
  let incident = "";
  let lastResult = null;
  let expanded = false;
  const context = {};
  const rankKey = (plan) => [
    Math.max(0, ...(plan.orders || []).filter((o) => o.priority === "critical").map((o) => o.delay_hours)),
    plan.projected_customer_delay_hours, plan.late_units || 0, plan.incremental_cost_usd,
  ];
  const summary = (plan) => {
    const units = new Map();
    for (const a of plan.allocations) units.set(a.source, (units.get(a.source) || 0) + a.units);
    return [...units].map(([source, count]) => `${count} via ${String(source).replaceAll("-", " ")}`).join(" · ");
  };
  const byRank = (a, b) => rankKey(a).reduce((found, value, index) => found || value - rankKey(b)[index], 0);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function applyContext(update) {
    if (!update || typeof update !== "object") return;
    Object.assign(context, update);
    const root = document.documentElement;
    const light = context.theme ? context.theme === "light" : matchMedia("(prefers-color-scheme: light)").matches;
    root.dataset.theme = light ? "light" : "dark";
    for (const [name, value] of Object.entries(update.styles?.variables || {})) {
      if (HOST_STYLE.test(name) && typeof value === "string") root.style.setProperty(name, value);
    }
    const inset = context.safeAreaInsets || {};
    for (const side of ["top", "right", "bottom", "left"]) root.style.setProperty(`--inset-${side}`, `${Math.max(0, Number(inset[side]) || 0)}px`);
    const width = Number(context.containerDimensions?.width ?? context.containerDimensions?.maxWidth);
    document.body.classList.toggle("compact", context.deviceClass === "compact" || (Number.isFinite(width) && width < 480));
  }

  function pageOf(plans, limit) {
    if (expanded || plans.length <= limit) return { shown: plans, hidden: 0 };
    return { shown: plans.slice(0, limit), hidden: plans.length - limit };
  }

  const verdict = (order) => (order.delay_hours ? `+${order.delay_hours} h` : "on time");

  function namer(orders) {
    const priorities = orders.map((order) => order.priority);
    if (new Set(priorities).size < priorities.length) return (order) => order.customer;
    return (order) => (order.priority === "critical" ? "Critical" : "Standard");
  }

  function selectButton(plan, text) {
    const select = el("button", "", text);
    select.type = "button";
    select.setAttribute("aria-label", `Select “${plan.label}” for approval`);
    select.addEventListener("click", () => {
      request("ui/message", { role: "user", content: { type: "text", text: `Select plan ${plan.id}` } })
        .then(() => { select.textContent = "Selected — your host asks you to confirm"; })
        .catch(() => { select.textContent = "The host did not accept the selection"; })
        .finally(() => select.removeAttribute("aria-label"));
    });
    return select;
  }

  function doneTag(plan, approved, executed) {
    return plan.id === approved ? el("span", "tag done-tag", executed ? "Executed" : "Approved") : null;
  }

  function pickCard(plan, hinted, preference, approved, executed) {
    const item = el("section", "plan pick");
    const critical = (plan.orders || []).filter((order) => order.priority === "critical");
    const late = (plan.orders || []).filter((order) => order.delay_hours);
    const band = critical.length
      ? critical.some((order) => order.delay_hours) ? ["late", "Leaves a critical order late"] : ["ok", "Critical order on time"]
      : late.length ? ["late", `${late.length} order${late.length === 1 ? "" : "s"} late`] : ["ok", "Every order on time"];
    item.append(el("p", `band ${band[0]}`, band[1]));
    const heading = el("h2", "pick-name");
    const name = el("strong", "", plan.label);
    const tags = [el("span", "tag pick-tag", hinted === plan.id ? "Agent pick" : "Default pick"), doneTag(plan, approved, executed),
      plan.id === preference?.preferred_plan_id ? el("span", "tag", "Your preference") : null];
    name.append(...tags.filter(Boolean).slice(0, 2));
    heading.append(name);
    const text = el("div", "pick-text");
    text.append(heading, el("p", "allocation", summary(plan)));
    const figures = el("div", "figures");
    figures.append(el("span", "cost", `$${plan.incremental_cost_usd}`),
      el("span", "delay", plan.projected_customer_delay_hours ? `${plan.projected_customer_delay_hours} h delay` : "No delay"));
    item.append(text, figures);
    if (preference?.changes_pick && plan.id === preference.preferred_plan_id) item.append(el("p", "why", `Your preference: ${preference.reason}`));
    const outcomes = el("ul", "outcomes");
    outcomes.setAttribute("aria-label", "Each order's projected arrival against its promise");
    for (const order of plan.orders || []) {
      const row = el("li", order.delay_hours ? "late" : "on-time");
      row.append(el("span", "verdict", order.delay_hours ? `+${order.delay_hours} h late` : "On time"),
        el("span", "who", `${order.customer} · ${order.quantity} units${order.priority === "critical" ? " · critical" : ""}`));
      outcomes.append(row);
    }
    item.append(outcomes);
    if (!approved) item.append(selectButton(plan, "Select for approval"));
    return item;
  }

  function planRow(plan, preference, nameOf, approved, executed) {
    const item = el("li", "plan");
    const text = el("div");
    const name = el("strong", "plan-name", plan.label);
    if (plan.id === preference?.preferred_plan_id) name.append(el("span", "tag", "Your preference"));
    const done = doneTag(plan, approved, executed);
    if (done) name.append(done);
    text.append(name);
    if ((plan.orders || []).length > 1) {
      const orders = el("span", "orders");
      plan.orders.forEach((order, index) => {
        if (index) orders.append(" · ");
        orders.append(el("span", order.delay_hours ? "late" : "", `${nameOf(order)} ${verdict(order)}`));
      });
      text.append(orders);
    }
    const figures = el("div", "figures");
    figures.append(el("strong", "", `$${plan.incremental_cost_usd}`), el("small", "", `${plan.projected_customer_delay_hours} h delay`));
    item.append(text, figures);
    if (!approved) item.append(selectButton(plan, "Select"));
    return item;
  }

  function render(result) {
    lastResult = result;
    const plans = Array.isArray(result?.structuredContent?.plans) ? result.structuredContent.plans : [];
    const root = document.getElementById("root");
    root.className = "";
    root.replaceChildren(el("h1", "visually-hidden", incident ? `Resolution options · ${incident}` : "Resolution options"));
    const preference = result?.structuredContent?.operator_preferences;
    const hinted = result?._meta?.["logiops/recommended_plan_id"];
    const approved = plans.some((plan) => plan.id === result?._meta?.["logiops/approved_plan_id"]) ? result._meta["logiops/approved_plan_id"] : null;
    const executed = Boolean(approved && result?._meta?.["logiops/executed"]);
    const pick = plans.some((plan) => plan.id === hinted) ? hinted
      : plans.some((plan) => plan.id === preference?.preferred_plan_id) ? preference.preferred_plan_id
      : plans.length ? [...plans].sort(byRank)[0].id : null;
    const picked = plans.find((plan) => plan.id === pick);
    if (preference?.changes_pick && picked?.id !== preference.preferred_plan_id) root.append(el("p", "preference", `Your preference: ${preference.reason}`));
    if (picked) root.append(pickCard(picked, hinted, preference, approved, executed));
    const others = plans.filter((plan) => plan !== picked);
    const { shown, hidden } = pageOf(others, picked ? PAGE - 1 : PAGE);
    if (shown.length) {
      const title = el("h2", "others", picked ? `Other plan${others.length === 1 ? "" : "s"}` : `${plans.length} calculated plans`);
      title.id = "others-title";
      const list = el("ul", "plans");
      list.setAttribute("aria-labelledby", "others-title");
      const nameOf = namer(plans[0]?.orders || []);
      for (const plan of shown) list.append(planRow(plan, preference, nameOf, approved, executed));
      root.append(title, list);
    }
    if (hidden) {
      const more = el("button", "more", `See ${hidden} more plan${hidden === 1 ? "" : "s"}`);
      more.type = "button";
      more.addEventListener("click", () => {
        expanded = true;
        render(lastResult);
      });
      root.append(more);
    }
    if (!plans.length) root.append(el("p", "waiting", "No feasible plan for this incident's current data."));
    const status = executed ? "The approved plan was executed." : approved ? "A plan is approved; selection is closed." : "Selecting a plan does not approve it.";
    root.append(el("p", "footnote", `${incident ? `${incident} · ` : ""}Projections from synthetic carrier quotes. ${status}`));
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending.has(message.id)) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) reject(message.error); else resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-input") incident = String(message.params?.arguments?.shipment_id || "").toUpperCase();
    else if (message.method === "ui/notifications/tool-result") {
      expanded = false;
      render(message.params);
    } else if (message.method === "ui/notifications/host-context-changed") applyContext(message.params);
    else if (message.method === "ui/resource-teardown" && message.id !== undefined) {
      send({ jsonrpc: "2.0", id: message.id, result: {} });
    } else if (typeof message.method === "string" && message.id !== undefined) {
      send({ jsonrpc: "2.0", id: message.id, error: { code: -32601, message: "Method not supported by this view" } });
    }
  });

  new ResizeObserver(() => {
    const box = document.body.getBoundingClientRect();
    notify("ui/notifications/size-changed", { width: Math.ceil(box.width), height: Math.ceil(box.height) });
  }).observe(document.body);

  request("ui/initialize", {
    appInfo: { name: "LogiOps resolution options", version: "1.1.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: PROTOCOL,
  }).then((result) => {
    applyContext(result?.hostContext);
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
