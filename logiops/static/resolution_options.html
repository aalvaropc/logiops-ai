<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Resolution options</title>
<style>
  @font-face { font-family: "Overpass"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("logiops-card-font.woff2") format("woff2"); unicode-range: U+0000-00B6, U+00B8-FFFF; }
  :root, :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #0D1118); --card: var(--color-background-secondary, #0D1118);
    --text: var(--color-text-primary, #F4F1E8); --muted: var(--color-text-secondary, #8A97AB);
    --line: var(--color-border-primary, #232A35); --rule: #3A4352; --accent: #F4F1E8; --accent-hover: #D8D3C6; --accent-ink: #07090D;
    --button-hover: #1A212C; --late: #FF453A; --ok: #F4F1E8;
    --tag-ink: #FFB224; --preference: #FFB224; --pad: 16px;
    --inset-top: 0px; --inset-right: 0px; --inset-bottom: 0px; --inset-left: 0px;
    --type-tag: 12px; --type-meta: 14px; --type-body: 15px; --type-lead: clamp(17px, 1.5vw, 20px); --type-figure: clamp(28px, 2.6vw, 34px);
    color-scheme: dark; font-family: var(--font-sans, "Overpass", ui-sans-serif, system-ui, sans-serif); font-synthesis: none;
    color: var(--text); background: var(--bg);
  }
  :root[data-theme="light"] {
    --bg: var(--color-background-primary, #FFFFFF); --card: var(--color-background-secondary, #FFFFFF);
    --text: var(--color-text-primary, #111418); --muted: var(--color-text-secondary, #454C55);
    --line: var(--color-border-primary, #C9CED5); --rule: #111418; --accent: #0B4F9C; --accent-hover: #093F7D; --accent-ink: #FFFFFF;
    --button-hover: #F4F5F7; --late: #B8102A; --ok: #1D7A3C;
    --tag-ink: #664400; --preference: #664400;
    color-scheme: light;
  }
  body { margin: 0; padding: var(--inset-top) var(--inset-right) var(--inset-bottom) var(--inset-left); background: var(--bg); font-size: var(--type-meta); line-height: 1.4; }
  h2 { margin: 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .waiting { padding: var(--pad); color: var(--muted); }
  #root.decided { display: grid; grid-template-columns: minmax(0, 1fr); }
  #root.decided > * { grid-column: 1 / -1; }
  .field { margin: 0; padding: 14px var(--pad) 4px; }
  .field svg { display: block; width: 100%; height: auto; overflow: visible; }
  .field .axis { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .field .tick { stroke: var(--line); stroke-width: 1.5; }
  .field .axis-label { fill: var(--muted); font-size: var(--type-tag); font-weight: 700; letter-spacing: .04em; }
  .field .dot { stroke-width: 2.5; }
  .field .dot.on-time { fill: var(--ok); stroke: var(--ok); }
  .field .dot.late { fill: var(--muted); stroke: var(--muted); }
  .field .dot.critical-late { fill: var(--bg); stroke: var(--late); }
  .field .dot.chosen { fill: var(--accent); stroke: var(--accent); }
  .field .dot-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .field .dot-glow { fill: var(--accent); opacity: .45; }
  .field .dot-label { fill: var(--muted); font-size: var(--type-tag); font-weight: 700; font-variant-numeric: tabular-nums; }
  .field .dot-label.chosen { fill: var(--text); font-size: var(--type-meta); font-weight: 800; }
  .field-key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: var(--type-tag); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .field-key li { display: inline-flex; align-items: center; gap: 6px; }
  .field-key li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
  .field-key .late::before { background: var(--muted); }
  .field-key .critical-late::before { box-sizing: border-box; border: 2px solid var(--late); background: transparent; }
  .plan.pick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: start; padding: 16px var(--pad); border-bottom: 1px solid var(--line); background: var(--card); }
  .band { margin: 0; font-size: var(--type-body); font-weight: 700; line-height: 1.4; }
  .band.ok { color: var(--ok); }
  .band.late { color: var(--late); }
  .pick-name { font-size: var(--type-lead); line-height: 1.3; letter-spacing: -.01em; text-wrap: balance; }
  .pick .figures { text-align: right; white-space: nowrap; }
  .cost { display: block; font-size: var(--type-figure); font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums slashed-zero; }
  .delay { display: block; margin-top: 6px; color: var(--muted); }
  .why { grid-column: 1 / -1; margin: 0; color: var(--preference); line-height: 1.5; }
  p.preference { margin: 0; padding: 12px var(--pad) 0; color: var(--preference); line-height: 1.5; }
  .outcomes { grid-column: 1 / -1; display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: var(--type-body); }
  .outcomes li { display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 12px; align-items: baseline; }
  .outcomes .verdict { justify-self: start; color: var(--ok); font-size: var(--type-tag); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .outcomes .late .verdict { color: var(--late); text-decoration: underline dashed 2px; text-underline-offset: 4px; }
  .pick-text { display: grid; gap: 6px; min-width: 0; }
  .allocation { margin: 0; color: var(--muted); }
  .pick button { grid-column: 1 / -1; justify-self: start; border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .pick button:hover { background: var(--accent-hover); }
  .others { padding: 14px var(--pad) 2px; color: var(--muted); font-size: var(--type-meta); font-weight: 600; }
  .plans { margin: 0; padding: 0; list-style: none; }
  .plans .plan { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 16px; align-items: center; padding: 10px var(--pad); }
  .plans .plan + .plan { border-top: 1px solid var(--line); }
  .plan-name { font-size: var(--type-body); }
  .orders { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; color: var(--muted); }
  .plans .figures { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums slashed-zero; }
  .plans .figures strong { display: block; font-size: var(--type-body); }
  .plans .figures small { display: block; color: var(--muted); font-size: var(--type-meta); }
  button { min-height: 44px; padding: 6px 20px; border: 1.5px solid var(--muted); border-radius: 999px; background: transparent; color: var(--text); font: inherit; font-size: var(--type-body); font-weight: 800; cursor: pointer; }
  button:hover { background: var(--button-hover); }
  button:focus-visible { outline: 3px solid var(--rule); outline-offset: 2px; }
  button.more { margin: 4px var(--pad) 0; }
  .diff { font-weight: 800; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 4px; text-decoration-skip-ink: none; }
  .chip { display: inline-block; color: var(--ok); font-size: var(--type-tag); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .chip.late { color: var(--late); text-decoration: underline dashed 2px; text-underline-offset: 4px; }
  .tag { display: inline-block; margin-left: 10px; vertical-align: 2px; color: var(--tag-ink); font-size: var(--type-tag); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .tag.pick-tag { color: var(--accent); }
  .tag.done-tag { color: var(--ok); }
  .footnote { margin: 0; padding: 12px var(--pad) 14px; color: var(--muted); font-size: var(--type-meta); }
  body.compact { --pad: 12px; --type-meta: 15px; --type-body: 16px; }
  body.compact .plan.pick { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  body.compact .pick .figures { text-align: left; }
  body.compact .cost { display: inline; }
  body.compact .delay { display: inline; margin: 0 0 0 8px; }
  body.compact .outcomes li { grid-template-columns: 6em minmax(0, 1fr); }
  body.compact .plans .plan { grid-template-columns: minmax(0, 1fr) auto; }
  body.compact .plans .plan button { grid-column: 1 / -1; justify-self: start; }
  body.compact button { min-height: 48px; }
  body.compact .pick button { justify-self: stretch; }
  body:not(.compact) #root.decided { grid-template-columns: minmax(0, 400px) minmax(0, 1fr); align-items: start; }
  body:not(.compact) #root.decided > .field { grid-column: 1; padding-right: 0; }
  body:not(.compact) #root.decided > .plan.pick { grid-column: 2; border-bottom: 0; }
  @media (forced-colors: active) {
    .field .axis, .field .tick, .field .dot, .field .dot-ring { stroke: CanvasText; }
    .field .dot.on-time, .field .dot.late, .field .dot.chosen, .field .dot-label, .field .axis-label { fill: CanvasText; }
    .field .dot.critical-late { fill: Canvas; }
    .field .dot-glow { display: none; }
  }
</style>
</head>
<body>
<main id="root" class="waiting">Waiting for the investigation result…</main>
<script>LOGIOPS_CARD_FIELD</script>
<script>
"use strict";
(() => {
  const PROTOCOL = "2026-01-26";
  const PAGE = 5;
  const HOST_STYLE = /^--(?:color|font|border)-[a-z0-9-]+$/;
  let nextId = 1;
  const pending = new Map();
  const send = (message) => window.parent.postMessage(message, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    send({ jsonrpc: "2.0", id, method, params });
  });
  const notify = (method, params) => send({ jsonrpc: "2.0", method, params });
  let incident = "";
  let lastResult = null;
  let expanded = false;
  const context = {};
  const rankKey = (plan) => [
    Math.max(0, ...(plan.orders || []).filter((o) => o.priority === "critical").map((o) => o.delay_hours)),
    plan.projected_customer_delay_hours, plan.late_units || 0, plan.incremental_cost_usd,
  ];
  const summary = (plan) => {
    const units = new Map();
    for (const a of plan.allocations) units.set(a.source, (units.get(a.source) || 0) + a.units);
    return [...units].map(([source, count]) => `${count} via ${String(source).replaceAll("-", " ")}`).join(" · ");
  };
  const byRank = (a, b) => rankKey(a).reduce((found, value, index) => found || value - rankKey(b)[index], 0);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function svg(tag, attributes, text) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [name, value] of Object.entries(attributes || {})) node.setAttribute(name, String(value));
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function fieldFigure(plans, picked) {
    const shapes = window.LogiOpsField;
    const field = shapes.decisionField(plans, picked?.id, document.body.classList.contains("compact") ? shapes.NARROW : shapes.WIDE);
    const { left, right, top, bottom, ticks } = field.axes;
    const others = plans.length - 1;
    const said = picked
      ? `${plans.length} plans by delay and cost. The pick costs $${picked.incremental_cost_usd} with ${picked.projected_customer_delay_hours} h of delay; ${others} other plan${others === 1 ? "" : "s"}.`
      : `${plans.length} plans by delay and cost.`;
    const map = svg("svg", { viewBox: `0 0 ${field.view.width} ${field.view.height}`, role: "img", "aria-label": said });
    const glow = svg("filter", { id: "field-glow", x: "-100%", y: "-100%", width: "300%", height: "300%" });
    glow.append(svg("feGaussianBlur", { stdDeviation: 5 }));
    const defs = svg("defs");
    defs.append(glow);
    map.append(defs, svg("path", { d: `M${left} ${top - 8} V${bottom} H${right}`, class: "axis" }));
    ticks.forEach((tick, index) => {
      const last = index === ticks.length - 1;
      map.append(svg("line", { x1: tick.x, x2: tick.x, y1: bottom, y2: bottom + 5, class: "tick" }),
        svg("text", { x: tick.x, y: bottom + 20, "text-anchor": last && ticks.length > 1 ? "end" : tick.x - left < 20 ? "start" : "middle", class: "axis-label" },
          `${tick.delay} h${last ? " delay" : ""}`));
    });
    for (const point of field.points) {
      const anchor = point.x > right - 24 ? "end" : point.x < left + 24 ? "start" : "middle";
      if (point.pick) map.append(svg("circle", { cx: point.x, cy: point.y, r: 11, class: "dot-glow", filter: "url(#field-glow)" }),
        svg("circle", { cx: point.x, cy: point.y, r: 12, class: "dot-ring" }));
      map.append(svg("circle", { cx: point.x, cy: point.y, r: point.pick ? 6 : 5, class: `dot ${point.pick ? "chosen" : point.standing}` }));
      if (point.labelled) map.append(svg("text", { x: point.x, y: point.y - (point.pick ? 18 : 11), "text-anchor": anchor, class: `dot-label${point.pick ? " chosen" : ""}` }, `$${point.cost}`));
    }
    const key = el("ul", "field-key");
    key.setAttribute("aria-hidden", "true");
    key.append(el("li", "on-time", "on time"), el("li", "late", "some late"), el("li", "critical-late", "critical late"));
    const figure = el("figure", "field");
    figure.append(map, key);
    return figure;
  }

  function applyContext(update) {
    if (!update || typeof update !== "object") return;
    Object.assign(context, update);
    const root = document.documentElement;
    const light = context.theme ? context.theme === "light" : matchMedia("(prefers-color-scheme: light)").matches;
    root.dataset.theme = light ? "light" : "dark";
    for (const [name, value] of Object.entries(update.styles?.variables || {})) {
      if (HOST_STYLE.test(name) && typeof value === "string") root.style.setProperty(name, value);
    }
    const inset = context.safeAreaInsets || {};
    for (const side of ["top", "right", "bottom", "left"]) root.style.setProperty(`--inset-${side}`, `${Math.max(0, Number(inset[side]) || 0)}px`);
    const width = Number(context.containerDimensions?.width ?? context.containerDimensions?.maxWidth);
    const compact = context.deviceClass === "compact" || (Number.isFinite(width) && width < 480);
    if (compact === document.body.classList.contains("compact")) return;
    document.body.classList.toggle("compact", compact);
    if (lastResult) render(lastResult);
  }

  function pageOf(plans, limit) {
    if (expanded || plans.length <= limit) return { shown: plans, hidden: 0 };
    return { shown: plans.slice(0, limit), hidden: plans.length - limit };
  }

  const verdict = (order) => (order.delay_hours ? `+${order.delay_hours} h` : "on time");

  function nearestOf(label, labels) {
    const words = String(label).split(" ");
    let best = null;
    for (const other of labels) {
      if (other === label) continue;
      const theirs = String(other).split(" ");
      const table = Array.from({ length: words.length + 1 }, () => new Array(theirs.length + 1).fill(0));
      for (let i = words.length - 1; i >= 0; i -= 1) {
        for (let j = theirs.length - 1; j >= 0; j -= 1) {
          table[i][j] = words[i] === theirs[j] ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
        }
      }
      if (!best || table[0][0] > best.table[0][0]) best = { table, theirs, label: other };
    }
    return best;
  }

  function distinguishing(label, labels) {
    const words = String(label).split(" ");
    const best = nearestOf(label, labels);
    const common = best ? best.table[0][0] : 0;
    if (common < 2 || common * 2 < words.length || common === words.length) return [[String(label), false]];
    const shared = new Array(words.length).fill(false);
    for (let i = 0, j = 0; i < words.length && j < best.theirs.length;) {
      if (words[i] === best.theirs[j]) {
        shared[i] = true;
        i += 1;
        j += 1;
      } else if (best.table[i + 1][j] >= best.table[i][j + 1]) {
        i += 1;
      } else {
        j += 1;
      }
    }
    const segments = [];
    words.forEach((word, index) => {
      const last = segments[segments.length - 1];
      if (last && last[1] === !shared[index]) last[0] += ` ${word}`;
      else segments.push([word, !shared[index]]);
    });
    return segments;
  }

  function labelNodes(label, labels) {
    return distinguishing(label, labels).flatMap(([text, marked], index) => {
      const space = index ? " " : "";
      return marked ? [space, el("span", "diff", text)] : [`${space}${text}`];
    }).filter(Boolean);
  }

  function namer(orders) {
    const priorities = orders.map((order) => order.priority);
    if (new Set(priorities).size < priorities.length) return (order) => order.customer;
    return (order) => (order.priority === "critical" ? "Critical" : "Standard");
  }

  function selectButton(plan, text) {
    const select = el("button", "", text);
    select.type = "button";
    select.setAttribute("aria-label", `Select “${plan.label}” for approval`);
    select.addEventListener("click", () => {
      request("ui/message", { role: "user", content: { type: "text", text: `Select plan ${plan.id}` } })
        .then(() => { select.textContent = "Selected — your host asks you to confirm"; })
        .catch(() => { select.textContent = "The host did not accept the selection"; })
        .finally(() => select.removeAttribute("aria-label"));
    });
    return select;
  }

  function doneTag(plan, approved, executed) {
    return plan.id === approved ? el("span", "tag done-tag", executed ? "Executed" : "Approved") : null;
  }

  function pickCard(plan, hinted, preference, approved, executed, labels) {
    const item = el("section", "plan pick");
    const critical = (plan.orders || []).filter((order) => order.priority === "critical");
    const late = (plan.orders || []).filter((order) => order.delay_hours);
    const band = critical.length
      ? critical.some((order) => order.delay_hours) ? ["late", "Leaves a critical order late"] : ["ok", "Critical order on time"]
      : late.length ? ["late", `${late.length} order${late.length === 1 ? "" : "s"} late`] : ["ok", "Every order on time"];
    const heading = el("h2", "pick-name");
    const name = el("strong");
    name.append(...labelNodes(plan.label, labels));
    const tags = [el("span", "tag pick-tag", hinted === plan.id ? "Agent pick" : "Default pick"), doneTag(plan, approved, executed),
      plan.id === preference?.preferred_plan_id ? el("span", "tag", "Your preference") : null];
    name.append(...tags.filter(Boolean).slice(0, 2));
    heading.append(name);
    const text = el("div", "pick-text");
    text.append(heading, el("p", `band ${band[0]}`, band[1]), el("p", "allocation", summary(plan)));
    const figures = el("div", "figures");
    figures.append(el("span", "cost", `$${plan.incremental_cost_usd}`),
      el("span", "delay", plan.projected_customer_delay_hours ? `${plan.projected_customer_delay_hours} h delay` : "No delay"));
    item.append(text, figures);
    if (preference?.changes_pick && plan.id === preference.preferred_plan_id) item.append(el("p", "why", `Your preference: ${preference.reason}`));
    const outcomes = el("ul", "outcomes");
    outcomes.setAttribute("aria-label", "Each order's projected arrival against its promise");
    for (const order of plan.orders || []) {
      const row = el("li", order.delay_hours ? "late" : "on-time");
      row.append(el("span", "verdict", order.delay_hours ? `+${order.delay_hours} h late` : "On time"),
        el("span", "who", `${order.customer} · ${order.quantity} units${order.priority === "critical" ? " · critical order" : ""}`));
      outcomes.append(row);
    }
    item.append(outcomes);
    if (!approved) item.append(selectButton(plan, "Select for approval"));
    return item;
  }

  function planRow(plan, preference, nameOf, approved, executed, labels) {
    const item = el("li", "plan");
    const text = el("div");
    const name = el("strong", "plan-name");
    name.append(...labelNodes(plan.label, labels));
    if (plan.id === preference?.preferred_plan_id) name.append(el("span", "tag", "Your preference"));
    const done = doneTag(plan, approved, executed);
    if (done) name.append(done);
    text.append(name);
    if ((plan.orders || []).length > 1) {
      const orders = el("span", "orders");
      for (const order of plan.orders) {
        const line = el("span", "", `${nameOf(order)} `);
        line.append(el("span", `chip${order.delay_hours ? " late" : ""}`, verdict(order)));
        orders.append(line);
      }
      text.append(orders);
    }
    const figures = el("div", "figures");
    figures.append(el("strong", "", `$${plan.incremental_cost_usd}`), el("small", "", `${plan.projected_customer_delay_hours} h delay`));
    item.append(text, figures);
    if (!approved) item.append(selectButton(plan, "Select"));
    return item;
  }

  function render(result) {
    lastResult = result;
    const plans = Array.isArray(result?.structuredContent?.plans) ? result.structuredContent.plans : [];
    const root = document.getElementById("root");
    root.className = "";
    root.replaceChildren(el("h1", "visually-hidden", incident ? `Resolution options · ${incident}` : "Resolution options"));
    const preference = result?.structuredContent?.operator_preferences;
    const hinted = result?._meta?.["logiops/recommended_plan_id"];
    const approved = plans.some((plan) => plan.id === result?._meta?.["logiops/approved_plan_id"]) ? result._meta["logiops/approved_plan_id"] : null;
    const executed = Boolean(approved && result?._meta?.["logiops/executed"]);
    const pick = plans.some((plan) => plan.id === hinted) ? hinted
      : plans.some((plan) => plan.id === preference?.preferred_plan_id) ? preference.preferred_plan_id
      : plans.length ? [...plans].sort(byRank)[0].id : null;
    const picked = plans.find((plan) => plan.id === pick);
    if (preference?.changes_pick && picked?.id !== preference.preferred_plan_id) root.append(el("p", "preference", `Your preference: ${preference.reason}`));
    root.classList.toggle("decided", plans.length > 1);
    if (plans.length > 1) root.append(fieldFigure(plans, picked));
    const labels = plans.map((plan) => plan.label);
    if (picked) root.append(pickCard(picked, hinted, preference, approved, executed, labels));
    const others = plans.filter((plan) => plan !== picked);
    const compact = document.body.classList.contains("compact");
    if (picked) {
      const nearest = nearestOf(picked.label, labels)?.label;
      others.sort((a, b) => Number(b.label === nearest) - Number(a.label === nearest));
    }
    const { shown, hidden } = pageOf(others, picked ? (compact ? 1 : PAGE - 1) : PAGE);
    if (shown.length) {
      const title = el("h2", "others", picked ? `Other plan${others.length === 1 ? "" : "s"}` : `${plans.length} calculated plans`);
      title.id = "others-title";
      const list = el("ul", "plans");
      list.setAttribute("aria-labelledby", "others-title");
      const nameOf = namer(plans[0]?.orders || []);
      for (const plan of shown) list.append(planRow(plan, preference, nameOf, approved, executed, labels));
      root.append(title, list);
    }
    if (hidden) {
      const more = el("button", "more", `See ${hidden} more plan${hidden === 1 ? "" : "s"}`);
      more.type = "button";
      more.addEventListener("click", () => {
        expanded = true;
        render(lastResult);
      });
      root.append(more);
    }
    if (!plans.length) root.append(el("p", "waiting", "No feasible plan for this incident's current data."));
    const status = executed ? "The approved plan was executed." : approved ? "A plan is approved; selection is closed." : "Selecting a plan does not approve it.";
    root.append(el("p", "footnote", `${incident ? `${incident} · ` : ""}Projections from synthetic carrier quotes. ${status}`));
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending.has(message.id)) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) reject(message.error); else resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-input") incident = String(message.params?.arguments?.shipment_id || "").toUpperCase();
    else if (message.method === "ui/notifications/tool-result") {
      expanded = false;
      render(message.params);
    } else if (message.method === "ui/notifications/host-context-changed") applyContext(message.params);
    else if (message.method === "ui/resource-teardown" && message.id !== undefined) {
      send({ jsonrpc: "2.0", id: message.id, result: {} });
    } else if (typeof message.method === "string" && message.id !== undefined) {
      send({ jsonrpc: "2.0", id: message.id, error: { code: -32601, message: "Method not supported by this view" } });
    }
  });

  new ResizeObserver(() => {
    const box = document.body.getBoundingClientRect();
    notify("ui/notifications/size-changed", { width: Math.ceil(box.width), height: Math.ceil(box.height) });
  }).observe(document.body);

  request("ui/initialize", {
    appInfo: { name: "LogiOps resolution options", version: "1.1.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: PROTOCOL,
  }).then((result) => {
    applyContext(result?.hostContext);
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
