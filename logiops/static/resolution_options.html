<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Resolution options</title>
<style>
  :root {
    --bg: var(--color-background-primary, #071318); --card: var(--color-background-secondary, #0b1f27);
    --text: var(--color-text-primary, #e6f6fb); --muted: var(--color-text-secondary, #9fc3cc);
    --line: var(--color-border-primary, #1d4552); --accent: #1fc8ff; --accent-ink: #071318; --glow: rgba(31, 200, 255, .18);
    --button: #12313b; --button-line: #2b6c80; --button-hover: #1d4552; --order: #b9d4da; --late: #ffb8b0;
    --tag: #4a3a1c; --tag-ink: #ffe0b3; --preference: #f0d9a6;
    --inset-top: 0px; --inset-right: 0px; --inset-bottom: 0px; --inset-left: 0px;
    color-scheme: dark; font-family: var(--font-sans, Inter, ui-sans-serif, system-ui, sans-serif); color: var(--text); background: var(--bg);
  }
  :root[data-theme="light"] {
    --bg: var(--color-background-primary, #f6fafb); --card: var(--color-background-secondary, #ffffff);
    --text: var(--color-text-primary, #0b2730); --muted: var(--color-text-secondary, #4a6670);
    --line: var(--color-border-primary, #c5d9de); --accent: #0a6f8f; --accent-ink: #ffffff; --glow: rgba(10, 111, 143, .15);
    --button: #e8f2f5; --button-line: #8fb4bf; --button-hover: #d5e7ec; --order: #33515a; --late: #a3271c;
    --tag: #fbe7c2; --tag-ink: #5c3d00; --preference: #6b4a00;
    color-scheme: light;
  }
  body {
    margin: 0;
    padding: calc(14px + var(--inset-top)) calc(14px + var(--inset-right)) calc(14px + var(--inset-bottom)) calc(14px + var(--inset-left));
    background: var(--bg);
  }
  h1 { margin: 0 0 4px; font-size: 15px; letter-spacing: -.01em; }
  p.note { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .plans { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .plan { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .plan.pick { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, 0 0 16px var(--glow); }
  .plan strong { font-size: 13px; }
  .plan small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
  .figures { text-align: right; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .figures small { font-weight: 400; }
  button { grid-column: 1 / -1; justify-self: start; padding: 6px 12px; border: 1px solid var(--button-line); border-radius: 99px; background: var(--button); color: var(--text); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  button:hover { background: var(--button-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.more { margin-top: 8px; }
  .waiting { color: var(--muted); font-size: 13px; }
  .orders span { display: block; margin-top: 2px; color: var(--order); font-size: 11px; }
  .orders .late { color: var(--late); }
  .tag { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 99px; color: var(--tag-ink); background: var(--tag); font-size: 9px; font-weight: 800; text-transform: uppercase; }
  .tag.pick-tag { color: var(--accent-ink); background: var(--accent); }
  p.preference { margin: 0 0 10px; color: var(--preference); font-size: 12px; line-height: 1.5; }
  body.compact { padding: calc(10px + var(--inset-top)) calc(10px + var(--inset-right)) calc(10px + var(--inset-bottom)) calc(10px + var(--inset-left)); }
  body.compact .plan { grid-template-columns: minmax(0, 1fr); }
  body.compact .figures { text-align: left; }
  body.compact .figures small { display: inline; margin-left: 6px; }
</style>
</head>
<body>
<main id="root" class="waiting">Waiting for the investigation result…</main>
<script>
"use strict";
(() => {
  const PROTOCOL = "2026-01-26";
  const PAGE = 5;
  const HOST_STYLE = /^--(?:color|font|border)-[a-z0-9-]+$/;
  let nextId = 1;
  const pending = new Map();
  const send = (message) => window.parent.postMessage(message, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    send({ jsonrpc: "2.0", id, method, params });
  });
  const notify = (method, params) => send({ jsonrpc: "2.0", method, params });
  let incident = "";
  let lastResult = null;
  let expanded = false;
  const context = {};
  const rankKey = (plan) => [
    Math.max(0, ...(plan.orders || []).filter((o) => o.priority === "critical").map((o) => o.delay_hours)),
    plan.projected_customer_delay_hours, plan.late_units || 0, plan.incremental_cost_usd,
  ];
  const summary = (plan) => {
    const units = new Map();
    for (const a of plan.allocations) units.set(a.source, (units.get(a.source) || 0) + a.units);
    return [...units].map(([source, count]) => `${count} via ${String(source).replaceAll("-", " ")}`).join(" · ");
  };
  const byRank = (a, b) => rankKey(a).reduce((found, value, index) => found || value - rankKey(b)[index], 0);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function applyContext(update) {
    if (!update || typeof update !== "object") return;
    Object.assign(context, update);
    const root = document.documentElement;
    const light = context.theme ? context.theme === "light" : matchMedia("(prefers-color-scheme: light)").matches;
    root.dataset.theme = light ? "light" : "dark";
    for (const [name, value] of Object.entries(update.styles?.variables || {})) {
      if (HOST_STYLE.test(name) && typeof value === "string") root.style.setProperty(name, value);
    }
    const inset = context.safeAreaInsets || {};
    for (const side of ["top", "right", "bottom", "left"]) root.style.setProperty(`--inset-${side}`, `${Math.max(0, Number(inset[side]) || 0)}px`);
    const width = Number(context.containerDimensions?.width ?? context.containerDimensions?.maxWidth);
    document.body.classList.toggle("compact", context.deviceClass === "compact" || (Number.isFinite(width) && width < 480));
  }

  function pageOf(plans, pick) {
    if (expanded || plans.length <= PAGE) return { shown: plans, hidden: 0 };
    const shown = plans.slice(0, PAGE);
    const picked = plans.find((plan) => plan.id === pick);
    if (picked && !shown.includes(picked)) shown[PAGE - 1] = picked;
    return { shown, hidden: plans.length - PAGE };
  }

  function card(plan, pick, hinted, preference) {
    const item = el("li", `plan${plan.id === pick ? " pick" : ""}`);
    const text = el("div");
    const name = el("strong", "", plan.label);
    if (plan.id === pick) name.append(el("span", "tag pick-tag", hinted === pick ? "Agent pick" : "Default pick"));
    if (preference && plan.id === preference.preferred_plan_id) name.append(el("span", "tag", "Your preference"));
    text.append(name, el("small", "", summary(plan)));
    if ((plan.orders || []).length > 1) {
      const orders = el("div", "orders");
      for (const order of plan.orders) {
        orders.append(el("span", order.delay_hours ? "late" : "",
          `${order.order_id}${order.priority === "critical" ? " (critical)" : ""}: ${order.delay_hours ? `+${order.delay_hours} h` : "on time"}`));
      }
      text.append(orders);
    }
    const figures = el("div", "figures", `$${plan.incremental_cost_usd}`);
    figures.append(el("small", "", `${plan.projected_customer_delay_hours} h delay`));
    const select = el("button", "", "Select for approval");
    select.type = "button";
    select.addEventListener("click", () => {
      request("ui/message", { role: "user", content: { type: "text", text: `Select plan ${plan.id}` } })
        .then(() => { select.textContent = "Selected — approve it in the operator panel"; })
        .catch(() => { select.textContent = "The host did not accept the selection"; });
    });
    item.append(text, figures, select);
    return item;
  }

  function render(result) {
    lastResult = result;
    const plans = Array.isArray(result?.structuredContent?.plans) ? result.structuredContent.plans : [];
    const root = document.getElementById("root");
    root.className = "";
    root.replaceChildren();
    root.append(el("h1", "", incident ? `Resolution options · ${incident}` : "Resolution options"),
      el("p", "note", "Projections from synthetic carrier quotes. Selecting a plan does not approve it."));
    const preference = result?.structuredContent?.operator_preferences;
    if (preference?.changes_pick) root.append(el("p", "preference", `Your preference: ${preference.reason}`));
    const hinted = result?._meta?.["logiops/recommended_plan_id"];
    const pick = plans.some((plan) => plan.id === hinted) ? hinted
      : plans.some((plan) => plan.id === preference?.preferred_plan_id) ? preference.preferred_plan_id
      : plans.length ? [...plans].sort(byRank)[0].id : null;
    const { shown, hidden } = pageOf(plans, pick);
    const list = el("ul", "plans");
    list.setAttribute("aria-label", `${plans.length} calculated plan${plans.length === 1 ? "" : "s"}`);
    for (const plan of shown) list.append(card(plan, pick, hinted, preference));
    root.append(list);
    if (hidden) {
      const more = el("button", "more", `See ${hidden} more plan${hidden === 1 ? "" : "s"}`);
      more.type = "button";
      more.addEventListener("click", () => {
        expanded = true;
        render(lastResult);
      });
      root.append(more);
    }
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending.has(message.id)) {
      const { resolve, reject } = pending.get(message.id);
      pending.delete(message.id);
      if (message.error) reject(message.error); else resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-input") incident = String(message.params?.arguments?.shipment_id || "").toUpperCase();
    else if (message.method === "ui/notifications/tool-result") {
      expanded = false;
      render(message.params);
    } else if (message.method === "ui/notifications/host-context-changed") applyContext(message.params);
    else if (message.method === "ui/resource-teardown" && message.id !== undefined) {
      send({ jsonrpc: "2.0", id: message.id, result: {} });
    } else if (typeof message.method === "string" && message.id !== undefined) {
      send({ jsonrpc: "2.0", id: message.id, error: { code: -32601, message: "Method not supported by this view" } });
    }
  });

  new ResizeObserver(() => {
    const box = document.body.getBoundingClientRect();
    notify("ui/notifications/size-changed", { width: Math.ceil(box.width), height: Math.ceil(box.height) });
  }).observe(document.body);

  request("ui/initialize", {
    appInfo: { name: "LogiOps resolution options", version: "1.1.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: PROTOCOL,
  }).then((result) => {
    applyContext(result?.hostContext);
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
