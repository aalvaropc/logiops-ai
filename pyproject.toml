[project]
name = "logiops-ai"
version = "0.2.0"
description = "A local, auditable logistics exception workflow"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.40,<2",
    "fastapi>=0.115,<1",
    "mcp==1.28.1",
    "pydantic==2.13.4",
    "pyjwt[crypto]>=2.10",
    "strands-agents==1.60.0",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pygments==2.20.0", "pytest>=8,<10"]
browser = ["axe-playwright-python>=0.1.8,<1", "playwright==1.62.0", "pytest-playwright>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
